name: bulk_extractor build and test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'AGENTS.md'
      - 'doc/**'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    name: Debian Bookworm build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout recursively
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Bootstrap and build in Debian
        run: |
          # This is a compile-only compatibility job.  The full test suite runs
          # in the platform build jobs below, so do not add `make check` here.
          docker run --rm \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/src \
            --workdir /src \
            debian:bookworm \
            bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                autoconf automake build-essential flex git libabsl-dev \
                libexpat1-dev libgcrypt20-dev libgpg-error-dev libre2-dev \
                libssl-dev libtool make pkg-config procps python3 zlib1g-dev
              git config --global --add safe.directory /src
              bash bootstrap.sh
              ./configure --disable-libewf --enable-silent-rules --quiet
              make -j2
            '

  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    env:
      DEBUG_5G: FALSE
      DEBUG_FAST: FALSE
      MAKE_OPTS: -j2

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: extract_version
        run: |
          version=$(grep 'AC_INIT(\[BULK_EXTRACTOR\]' configure.ac | cut -d',' -f2 | tr -d '[]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: |
          source "$HOME/.bashrc"
          echo "" | bash etc/CONFIGURE_MACOS.bash

      - name: Install Ubuntu dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: echo "" | bash etc/CONFIGURE_UBUNTU22LTS.bash

      - name: Bootstrap
        run: bash bootstrap.sh

      - name: AddressSanitizer debug build and tests
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-22.04'
        run: |
          source "$HOME/.bashrc"
          ./configure --disable-opt --enable-address-sanitizer
          make $MAKE_OPTS all
          make -C src $MAKE_OPTS bulk_extractor
          make -C src check || (cat src/test-suite.log; exit 1)
          make distclean

      - name: ThreadSanitizer thread-safety test
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: |
          source "$HOME/.bashrc"
          ./configure --disable-opt --enable-thread-sanitizer
          make -C src $MAKE_OPTS check-tsan-thread-safety
          make distclean

      - name: Distribution check with Exiv2
        run: |
          source "$HOME/.bashrc"
          ./configure --enable-exiv2 --quiet
          grep -q '^#define HAVE_EXIV2 1$' config.h
          make DISTCHECK_CONFIGURE_FLAGS=--enable-exiv2 distcheck

      - name: Upload source distribution
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: bulk_extractor-${{ steps.extract_version.outputs.version }}-${{ matrix.os }}
          path: bulk_extractor-${{ steps.extract_version.outputs.version }}.tar.gz
