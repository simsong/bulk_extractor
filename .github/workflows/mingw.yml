name: Windows MinGW build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_COMMIT: 40f3c709db80acf154ac4b17a1f83c564ebd022e
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg

jobs:
  mingw:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Ubuntu MinGW executable
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Ubuntu cross-build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake binutils-mingw-w64-x86-64 cmake curl file flex g++ \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            git libgcrypt-mingw-w64-dev libgpg-error-mingw-w64-dev \
            libtool libz-mingw-w64-dev make ninja-build pkg-config python3 \
            unzip zip
          sudo update-alternatives --set x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Build static RE2, Abseil, and Expat
        run: |
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" install \
            expat:x64-mingw-static \
            re2:x64-mingw-static \
            --host-triplet=x64-linux \
            --clean-after-build

      - name: Cross-compile bulk_extractor
        run: |
          bash bootstrap.sh
          mkdir build-mingw
          cd build-mingw
          target_root="$VCPKG_ROOT/installed/x64-mingw-static"
          PKG_CONFIG="pkg-config --static" \
          PKG_CONFIG_LIBDIR="$target_root/lib/pkgconfig" \
          CPPFLAGS="-I$target_root/include" \
          LDFLAGS="-L$target_root/lib" \
            ../configure --host=x86_64-w64-mingw32 --disable-libewf --quiet
          make -j2 LDFLAGS="-L$target_root/lib -all-static"

      - name: Verify standalone Windows executable
        run: |
          exe=build-mingw/src/.libs/bulk_extractor.exe
          if [[ ! -s "$exe" ]]; then
            exe=build-mingw/src/bulk_extractor.exe
          fi
          test -s "$exe"
          test "$(stat -c %s "$exe")" -gt 1000000
          file "$exe" | grep -q 'PE32+ executable'
          x86_64-w64-mingw32-objdump -p "$exe" \
            | sed -n 's/^[[:space:]]*DLL Name: //p' \
            | sort -u | tee dll-imports.txt
          grep -Eiv \
            '^(ADVAPI32|DBGHELP|GDI32|KERNEL32|msvcrt|PSAPI|SHELL32|USER32|WS2_32)\.dll$' \
            dll-imports.txt > non-system-dll-imports.txt || true
          if [[ -s non-system-dll-imports.txt ]]; then
            echo "DLLs outside the Windows system allowlist:" >&2
            sed 's/^/  /' non-system-dll-imports.txt >&2
            exit 1
          fi
          cp "$exe" bulk_extractor64.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: bulk_extractor-windows-x86_64
          path: bulk_extractor64.exe
          if-no-files-found: error

  windows-unicode:
    name: Windows runtime tests
    needs: mingw
    runs-on: windows-latest

    steps:
      - name: Checkout test fixtures
        uses: actions/checkout@v5

      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: bulk_extractor-windows-x86_64
          path: dist

      - name: Scan a directory containing a Unicode filename
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path input | Out-Null
          $filename = Join-Path $PWD "input\©_test.txt"
          [IO.File]::WriteAllText(
            $filename,
            "unicode-path@example.com`n",
            [Text.UTF8Encoding]::new($false))

          & "$PWD\dist\bulk_extractor64.exe" -R -o output input 2>&1 |
            Tee-Object -FilePath run.log
          if ($LASTEXITCODE -ne 0) {
            throw "bulk_extractor exited with status $LASTEXITCODE"
          }
          if (Select-String -Path run.log -SimpleMatch "read error" -Quiet) {
            throw "bulk_extractor reported a read error for the Unicode filename"
          }
          if (-not (Test-Path output\email.txt)) {
            throw "bulk_extractor did not create email.txt"
          }
          if (-not (Select-String -Path output\email.txt `
                -SimpleMatch "unicode-path@example.com" -Quiet)) {
            throw "bulk_extractor did not scan the Unicode-named file"
          }

      - name: Scan the IP fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$PWD\dist\bulk_extractor64.exe" -0q -J -G 65536 `
            -o net-output "$PWD\src\tests\ntlm1.pcap"
          if ($LASTEXITCODE -ne 0) {
            throw "bulk_extractor exited with status $LASTEXITCODE"
          }
          $ipFile = "net-output\ip.txt"
          if (-not (Test-Path $ipFile)) {
            throw "bulk_extractor did not create ip.txt"
          }
          if (-not (Select-String -Path $ipFile -Pattern '(^|\s)192\.168\.0\.91(\s|$)' -Quiet)) {
            throw "bulk_extractor did not report the fixture's IPv4 address"
          }

      - name: Scan an attached FAT32 volume as a raw device
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vhd = Join-Path $PWD "raw-device-test.vhd"
          $diskpart = Join-Path $PWD "raw-device-test.diskpart"
          @"
          create vdisk file="$vhd" maximum=64 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=fat32 quick label=BERAWDEV
          assign
          exit
          "@ | Set-Content -Path $diskpart -NoNewline

          try {
            & diskpart /s $diskpart
            if ($LASTEXITCODE -ne 0) {
              throw "diskpart failed to create the FAT32 test volume"
            }
            $volume = Get-DiskImage -ImagePath $vhd | Get-Disk | Get-Partition | Get-Volume
            if ($null -eq $volume.DriveLetter) {
              throw "Windows did not assign a drive letter to the FAT32 test volume"
            }
            $drive = "$($volume.DriveLetter):"
            Copy-Item "$PWD\src\tests\1mb_fat32.dmg" "$drive\1mb_fat32.dmg"
            [IO.File]::WriteAllText("$drive\raw-device.txt", "raw-device@example.com`n",
              [Text.UTF8Encoding]::new($false))

            & "$PWD\dist\bulk_extractor64.exe" -0q -G 65536 -o raw-device-output $drive
            if ($LASTEXITCODE -ne 0) {
              throw "bulk_extractor could not scan the attached raw device"
            }
            if (-not (Select-String -Path raw-device-output\email.txt `
                  -SimpleMatch "raw-device@example.com" -Quiet)) {
              throw "bulk_extractor did not read the mounted FAT32 raw device"
            }

            $help = & "$PWD\dist\bulk_extractor64.exe" -h 2>&1 | Out-String
            if ($help -notmatch "PhysicalDriveN" -or $help -notmatch "Volume\{GUID\}") {
              throw "bulk_extractor help does not list Windows raw-device forms"
            }

            $rootOutput = & "$PWD\dist\bulk_extractor64.exe" -0q -o raw-device-root-output "$drive\" 2>&1 | Out-String
            if ($LASTEXITCODE -ne 7 -or $rootOutput -notmatch "specify the scan type explicitly") {
              throw "bulk_extractor did not reject an ambiguous drive root"
            }
          } finally {
            if (Test-Path $vhd) {
              Dismount-DiskImage -ImagePath $vhd -ErrorAction SilentlyContinue
            }
          }
          # The assertions above deliberately exercise nonzero exit codes.
          exit 0
