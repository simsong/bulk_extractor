name: Snap build and test

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; defaults to the triggering ref.
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/snap.yml'
      - 'snap/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/snap.yml'
      - 'snap/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Snap build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build snap
        id: snap
        shell: bash
        run: |
          set -euo pipefail
          sudo groupadd --force --system lxd
          sudo usermod --append --groups lxd "$USER"
          sudo snap install lxd
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          sudo snap install snapcraft --classic
          export SNAPCRAFT_BUILD_ENVIRONMENT=lxd
          export SNAPCRAFT_BUILD_INFO=1
          export SNAPCRAFT_IMAGE_INFO="{\"build_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          sudo -u "$USER" -E snapcraft pack
          shopt -s nullglob
          snaps=( ./*.snap )
          test "${#snaps[@]}" -eq 1
          echo "snap=${snaps[0]}" >> "$GITHUB_OUTPUT"

      - name: Install and run the strictly confined snap
        run: |
          set -euo pipefail
          sudo snap install --dangerous "${{ steps.snap.outputs.snap }}"
          sudo snap connect bulk-extractor:home :home
          image="$HOME/bulk_extractor-fat32.dmg"
          output="$HOME/bulk_extractor-snap-output"
          cp src/tests/1mb_fat32.dmg "$image"
          snap run bulk-extractor -0q -o "$output" "$image"
          test -s "$output/report.xml"

      - name: Upload snap
        uses: actions/upload-artifact@v7
        with:
          name: bulk-extractor-snap-${{ matrix.arch }}
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error
