name: Assemble draft GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed annotated tag, for example v2.2.0.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  snap:
    name: Build release Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Build Snap
        id: snap
        uses: canonical/action-build@v1

      - name: Install and test the Snap
        run: |
          set -euo pipefail
          sudo snap install --dangerous "${{ steps.snap.outputs.snap }}"
          sudo snap connect bulk-extractor:home :home
          image="$HOME/bulk_extractor-fat32.dmg"
          output="$HOME/bulk_extractor-snap-output"
          cp src/tests/1mb_fat32.dmg "$image"
          snap run bulk-extractor -0q -o "$output" "$image"
          test -s "$output/report.xml"

      - name: Upload Snap
        uses: actions/upload-artifact@v4
        with:
          name: release-snap-${{ matrix.arch }}
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

  assemble:
    name: Assemble draft release
    needs: snap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Download tested Snap packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-snap-*
          path: snap-assets
          merge-multiple: true

      - name: Assemble release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/assemble_github_release.py \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --output-dir release-assets

      - name: Add Snap packages and append checksums
        run: |
          set -euo pipefail
          amd64=$(find snap-assets -type f -name '*_amd64.snap' -print -quit)
          arm64=$(find snap-assets -type f -name '*_arm64.snap' -print -quit)
          test -n "$amd64"
          test -n "$arm64"
          test -s "$amd64"
          test -s "$arm64"
          cp "$amd64" "$arm64" release-assets/
          (
            cd release-assets
            sha256sum "$(basename "$amd64")" "$(basename "$arm64")" >> SHA256SUMS
          )

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]; then
            echo "$RELEASE_TAG must be an annotated tag" >&2
            exit 2
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse "$RELEASE_TAG^{commit}")" \
            --draft \
            --title "BE ${RELEASE_TAG}" \
            --generate-notes \
            release-assets/bulk_extractor-*.tar.gz \
            release-assets/bulk_extractor64.exe \
            release-assets/*.snap \
            release-assets/SHA256SUMS
